<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- Load the theme overrides and apply the saved preference before first paint. -->
  <link rel="stylesheet" href="{{ "/assets/css/dark-mode.css" | relative_url }}">
  <script>
    // Apply the saved theme early so switching modes does not flash the wrong palette.
    (function () {
      var storageKey = "personal-blog-theme";
      var storedTheme;
      var systemTheme;

      try {
        storedTheme = window.localStorage.getItem(storageKey);
      } catch (error) {
        storedTheme = null;
      }

      systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";

      document.documentElement.setAttribute(
        "data-theme",
        storedTheme === "dark" || storedTheme === "light" ? storedTheme : systemTheme
      );
    }());
  </script>
  <script src="{{ "/assets/js/theme-toggle.js" | relative_url }}" defer></script>
</head>
